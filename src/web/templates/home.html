<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESB Multi-Agent Chatbot - Home</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .home-container {
            background: white;
            padding: 48px 40px 40px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            min-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 40px;
            color: #667eea;
            font-size: 2.2em;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .container {
            display: flex;
            gap: 40px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(102,126,234,0.08);
            padding: 40px 32px;
            width: 320px;
            text-align: center;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
            border: 1.5px solid #e9ecef;
        }
        .card:hover {
            box-shadow: 0 8px 32px rgba(102,126,234,0.16);
            transform: translateY(-4px) scale(1.03);
        }
        .card-title {
            font-size: 1.5em;
            margin-bottom: 16px;
            color: #667eea;
            font-weight: 600;
        }
        .card-desc {
            color: #555;
            margin-bottom: 24px;
        }
        .card-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }
        .card-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <div class="home-container">
        <h1>Welcome to ESB Multi-Agent Chatbot</h1>
        <div class="container">
            <div class="card" onclick="window.location.href='/login'">
                <div class="card-title">Student's Session</div>
                <div class="card-desc">Access the student chatbot and login to your account.</div>
                <button class="card-btn">Go to Student Area</button>
            </div>
            <div class="card" onclick="window.location.href='/admin/login'">
                <div class="card-title">Administration's Session</div>
                <div class="card-desc">Administration tools and management dashboard.</div>
                <button class="card-btn">Go to Admin Area</button>
            </div>
        </div>
    </div>
</body>
</html>
