<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ESB Multi-Agent Chatbot</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            min-width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #667eea;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .switch-link {
            text-align: center;
            margin-top: 10px;
        }
        .switch-link a {
            color: #667eea;
            text-decoration: underline;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Admin Login</h2>
        <div id="error" class="error"></div>
        <input id="username" type="text" placeholder="Admin Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="switch-link">Don't have an account? <a onclick="showRegister()">Register</a></div>
    </div>
    <script>
        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
                credentials: 'include'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Use redirect from backend if present, else fallback to /admin/landing
                    window.location.href = data.redirect || '/admin/landing';
                } else {
                    document.getElementById('error').innerText = data.error || 'Login failed';
                }
            });
        }
        function showRegister() {
            window.location.href = '/admin/register';
        }
    </script>
</body>
</html>
