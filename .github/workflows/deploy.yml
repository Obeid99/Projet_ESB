# This workflow will set up and run the Python backend
on:
  push:
    branches: [integration]
  pull_request:
    branches: [integration]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-production
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Start backend server in background
        run: |
          python run_server.py &
          sleep 5
        env:
          FLASK_APP: src/web/web_interface.py
          FLASK_RUN_HOST: 0.0.0.0
          FLASK_ENV: production

      - name: Check backend health
        run: |
          curl --fail http://127.0.0.1:5000 || (echo "Server did not respond" && exit 1)
